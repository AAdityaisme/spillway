# WHY THIS EXISTS: Ring 0 (`pnpm audit --prod --audit-level=high` in ci.yml) is a
# BLOCKING gate, and it is evaluated against the advisory database as it stands at the
# moment CI runs — not against anything in this repo. So a new advisory published against
# an unchanged dependency turns `main` red on the next unrelated push. That happened
# repeatedly (brace-expansion, shell-quote, fast-uri, find-my-way, and @fastify/static on
# 2026-08-03) and each time it was discovered by a red build rather than by an alert.
#
# The gate is correct and stays blocking — a HIGH in the production tree should stop a
# merge. What was missing is the other half: getting the fix proposed automatically, so
# the advisory arrives as a PR instead of as a broken main.
#
# Requires "Dependabot alerts" and "Dependabot security updates" enabled in repo settings;
# this file governs the scheduled version updates and the grouping.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    versioning-strategy: increase
    # Mirrors minimumReleaseAge in pnpm-workspace.yaml: don't propose a version until it
    # has survived 7 days on the registry. Security updates are exempt by design.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: scope
    # One PR per group instead of a swarm. Security updates ignore grouping and always
    # open their own PR, which is the behavior we want — they should not wait for Monday.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    # Majors land as individual PRs — they need a human reading a changelog
    # (@fastify/static 9 → 10 changed the setHeaders signature).
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # NO esbuild ENTRY HERE — deliberately, and this is the second attempt. Read before adding one.
      #
      # GHSA-67mh-4wv8-2f99 (moderate) is esbuild's DEVELOPMENT SERVER answering every origin with
      # `Access-Control-Allow-Origin: *`. Nothing here runs `esbuild serve`: the vulnerable copy
      # (0.18.20) arrives through the deprecated @esbuild-kit/esm-loader inside drizzle-kit, which
      # uses esbuild purely to transform its config file. vite and tsx already carry patched
      # 0.25.12/0.28.1, and Ring 0 audits --prod, so this never reached the production tree.
      #
      # Dependabot cannot fix it — `security_update_not_possible`, the pin is two levels down in an
      # unmaintained package. Bumping drizzle-kit to 0.31.10 was tested 2026-08-16 and still resolves
      # 0.18.20 through that same loader, so it buys nothing.
      #
      # `- dependency-name: 'esbuild'` WAS added here to stop the red. It does not work: the ignore
      # applies, and Dependabot then fails the job with `all_versions_ignored` instead of
      # `security_update_not_possible`. Still red, just differently. An ignore cannot silence a
      # SECURITY job — only dismissing the alert does.
      #
      # So the acceptance lives on the alert itself: alert #3 is dismissed as `tolerable_risk` with
      # this reasoning attached. That also keeps ordinary version updates for esbuild flowing, which
      # an ignore would have blocked forever — including the eventual bump that actually fixes this.
      # Re-open the alert if esbuild becomes reachable from the production tree, if the severity
      # rises, or if drizzle-kit drops @esbuild-kit.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
