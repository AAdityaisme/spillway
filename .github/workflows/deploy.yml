# .github/workflows/deploy.yml  (12-operations §3.4; Ring 4/5 gates per bible §0.6-0.7)
#
# M0 NOTE (Phase 0 — release gates wired, Fly infra not yet provisioned):
# trigger stays `workflow_dispatch` (manual) until Fly is provisioned at Half B. At Half B,
# switch the trigger to:
#     on:
#       push:
#         branches: [main]
# and add the FLY_API_TOKEN repo secret (`fly tokens create deploy -x 999999h`).
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: spillway
          POSTGRES_PASSWORD: spillway
          POSTGRES_DB: spillway_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: postgres://spillway_app:spillway_app@localhost:5432/spillway_test
      DATABASE_URL_JOBS: postgres://spillway_jobs:spillway_jobs@localhost:5432/spillway_test
      MIGRATION_DATABASE_URL: postgres://spillway:spillway@localhost:5432/spillway_test
      TEST_DATABASE_URL: postgres://spillway:spillway@localhost:5432/spillway_test
      POSTGRES_IMAGE: postgres:18.4-alpine
      SPILLWAY_ENC_KEY_V1: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= # 32 zero-bytes, base64; test only
      PORT: '3001'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      # init-roles CREATEs roles + GRANTs → needs the superuser/owner URL, not the app role (expanded-audit HIGH #4).
      - run: psql "${MIGRATION_DATABASE_URL:-$DATABASE_URL}" -f apps/server/src/db/migrations/init-roles.sql
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: pnpm migration-lint
      - run: pnpm build

  # The k6 SLO gate is NOT here — it is Ring 4 (`slo-load`) in release-gates.yml, which owns the
  # whole ring pipeline (image smoke → SBOM/scan → migration drill → SLO → bluegreen). This
  # workflow is the manual-dispatch deploy path only; duplicating the gate here would mean two k6
  # scripts and two definitions of the same SLO drifting apart.
  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Pinned to a release SHA, not @master — a compromised master would run with our live
      # FLY_API_TOKEN in scope (expanded-audit LOW). ed8efb3 == tag 1.6. Bump deliberately.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      # flyctl auth docker logs the local Docker daemon into registry.fly.io using
      # FLY_API_TOKEN, so the buildx push below (a plain registry push, no flyctl involved)
      # has credentials for Fly's registry.
      - run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Third-party action running after `flyctl auth docker` above → it and the push step below
      # hold live registry.fly.io credentials in scope, same rationale as the flyctl pin above.
      # Same pins as release-gates.yml. bb05f3f == v4.2.0.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Pushes a SHA-tagged image independent of flyctl's own release numbering, so
      # scripts/rollback.sh can target an exact commit (bible §0.7.4) rather than
      # whatever release number Fly assigned.
      # Third-party action with `push: true` → runs with the registry.fly.io credentials from
      # `flyctl auth docker` above. 53b7df9 == v7.3.0.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: registry.fly.io/spillway:deployment-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Deploy THE IMAGE JUST PUSHED, never `--remote-only`. --remote-only makes Fly run its own
      # build from the Dockerfile, so the artifact that reaches production is not the artifact this
      # job built, scanned and tagged — and scripts/rollback.sh, which rolls back by
      # `deployment-<sha>`, would then restore an image that never served traffic. --image also
      # skips a redundant second build. (Greptile flagged this on PR #1.)
      - run: flyctl deploy --image "registry.fly.io/spillway:deployment-${DEPLOY_SHA}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
      # Deploy log per bible §0.7.5: sha, actor, migration count. The SLO result is NOT here —
      # this is the manual path; Ring 4 in release-gates.yml records it for the ring pipeline.
      # github.* values go through env, never straight into the shell (zizmor template-injection).
      - name: Write deploy log
        if: always()
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          migration_count=$(find apps/server/src/db/migrations -maxdepth 1 -name '[0-9]*.sql' | wc -l | tr -d ' ')
          {
            echo "sha=${DEPLOY_SHA}"
            echo "actor=${DEPLOY_ACTOR}"
            echo "migration_count=${migration_count}"
          } | tee deploy-log.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deploy-log-${{ github.sha }}
          path: deploy-log.txt
          retention-days: 30
