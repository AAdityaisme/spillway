# fly.toml  (Fly.io v2 format)
app = "spillway"
primary_region = "iad"          # us-east (IAD). Change with: fly scale count --region

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  LOG_LEVEL = "info"
  # MUST match `fly scale count`. The 17 §3.6 singleton guard reads this; the in-process
  # rate limiter + policy cache are single-instance until the ADR-016 Redis bundle lands.
  # If you scale to N>1, bump this so the guard warns (limits become ~N x nominal per node).
  SPILLWAY_INSTANCE_COUNT = "1"

# Release command: runs migrations before new VM takes traffic.
# Migrations run via the programmatic migrator (dist/apps/server/src/db/migrate.js) — it
# bootstraps the app/jobs roles, then applies pending migrations with drizzle-orm's
# postgres-js migrator against MIGRATION_DATABASE_URL. Not `drizzle-kit migrate` directly.
# Idempotent, and concurrent deploys are safe because migrate.ts takes a pg_advisory_lock
# around the WHOLE path (roles + schema) — a second migrator blocks, then finds everything
# already applied.
# This comment previously claimed the safety came from "drizzle-kit uses advisory locks on the
# migrations table". That was false: drizzle's pg-core dialect takes no advisory lock, and the
# role DDL runs before migrate() anyway, so it was outside any lock drizzle could have held.
[deploy]
  # migrate.ts has an import.meta.url main-guard → running it directly invokes
  # runMigrations(). (Earlier `node -e "require(...esm...)"` failed: require-of-ESM
  # is not default-on until Node 22.12; runtime image is node:22.4.)
  release_command = "node dist/apps/server/src/db/migrate.js"
  # Default 5m is marginal for a cold migration run that includes role bootstrapping (bible §0.7.3).
  release_command_timeout = "10m"
  # bible §0.7.1 is a normative MUST: production deploys MUST use bluegreen. Complying literally
  # here even though the Ring 5 pitfalls note (and §0.8.3, which only mandates min_machines_running=2
  # for *staging*) means bluegreen needs >=2 machines to hold old+new concurrently, and prod is
  # pinned to min_machines_running = 1 by ADR-015 ("no scale-to-zero — SSE and in-memory rate
  # limiters"; changing that machine count is its own decision, out of scope here). With only 1
  # machine, Fly's bluegreen has no second machine to shift traffic onto, so in practice it behaves
  # like rolling until prod is scaled to >=2 — that's a real tension between §0.7.1 and ADR-015 that
  # needs a proper ADR to resolve (bump prod machines, or formally except prod to canary); flagging
  # it here rather than silently picking canary again, since §0.7.1's MUST wins absent that ADR.
  strategy = "bluegreen"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false        # ADR-015: no scale-to-zero; in-process rate limiters require persistence
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250                # reject with 503 above; prevents memory OOM under burst
    soft_limit = 200                # Fly starts another machine above this if autoscale enabled

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
